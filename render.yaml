services:
  - type: web
    runtime: static
    name: genesis-studio
    repo: https://github.com/HyperNoesis/dawn
    branch: claude/final-studio-segmentation
    rootDir: genesis
    buildCommand: sh scripts/build-site.sh
    staticPublishPath: www
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
