name: Build Genesis Android
on:
  push:
    branches: [main]
    paths:
      - 'genesis/android/**'
      - 'genesis/capacitor.config.json'
      - 'genesis/package.json'
      - 'genesis/package-lock.json'
      - '.github/workflows/genesis-android.yml'
  pull_request:
    paths:
      - 'genesis/android/**'
      - 'genesis/capacitor.config.json'
      - 'genesis/package.json'
      - '.github/workflows/genesis-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genesis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genesis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit generated lockfile on first-party branch pushes
        if: github.event_name == 'push' && github.actor == 'HyperNoesis'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package-lock.json; then
            echo "Capacitor dependency lock is already current."
          else
            git add package-lock.json
            git commit -m "chore: lock resolved Capacitor 8 dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve CI-regenerated Capacitor 8 dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: Genesis-capacitor-8-package-lock
          path: genesis/package-lock.json
          if-no-files-found: error
      - name: Sync bundled app into native shell
        run: |
          node --version
          npx cap --version
          npm run sync
      - name: Build debug APK for device testing only
        working-directory: genesis/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-debug-apk-test-only
          path: genesis/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GENESIS_RELEASE_ENABLED == 'true'
    needs: debug-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: genesis
    env:
      GENESIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.GENESIS_RELEASE_KEYSTORE_BASE64 }}
      GENESIS_RELEASE_STORE_PASSWORD: ${{ secrets.GENESIS_RELEASE_STORE_PASSWORD }}
      GENESIS_RELEASE_KEY_ALIAS: ${{ secrets.GENESIS_RELEASE_KEY_ALIAS }}
      GENESIS_RELEASE_KEY_PASSWORD: ${{ secrets.GENESIS_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genesis/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install private release key
        shell: bash
        run: |
          set -euo pipefail
          for value in GENESIS_RELEASE_KEYSTORE_BASE64 GENESIS_RELEASE_STORE_PASSWORD GENESIS_RELEASE_KEY_ALIAS GENESIS_RELEASE_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "::error::Missing required release signing secret: $value"
              exit 1
            fi
          done
          echo "$GENESIS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/genesis-release.jks"
          chmod 600 "$RUNNER_TEMP/genesis-release.jks"
          echo "GENESIS_RELEASE_STORE_FILE=$RUNNER_TEMP/genesis-release.jks" >> "$GITHUB_ENV"
      - name: Install dependencies and sync
        run: npm install --no-audit --no-fund && npm run sync
      - name: Build signed Android App Bundle
        working-directory: genesis/android
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Genesis-signed-release-aab
          path: genesis/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish signed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Genesis.aab
          TAG="genesis-release-${{ github.run_number }}"
          gh release create "$TAG" Genesis.aab --title "Genesis Android release ${{ github.run_number }}" --notes "Signed production Android App Bundle." --target "${{ github.sha }}"
