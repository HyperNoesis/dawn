name: Deploy Genesis to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the site from the zip parts and verify the checksum
        run: |
          cd genesis/dist
          cat Genesis-v0.97-DEPLOY-www.zip.0* > /tmp/site.zip
          echo "$(cut -d' ' -f1 JOIN_CHECK.sha256)  /tmp/site.zip" | sha256sum -c -
          mkdir -p /tmp/_site && unzip -q /tmp/site.zip -d /tmp/_site
          touch /tmp/_site/.nojekyll
          test -f /tmp/_site/studio.html && test -f /tmp/_site/models/modnet.onnx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site from GitHub's servers
        run: |
          sleep 25
          B=https://hypernoesis.github.io/dawn
          bad=0
          for p in "" studio.html index.html sw.js manifest.json models/modnet.onnx models/ppmatting_v2.onnx js/app.js; do
            code=$(curl -s -o /dev/null -L -w '%{http_code} %{size_download}B %{content_type}' "$B/$p")
            echo "::notice title=live check::/dawn/$p -> $code"
            case "$code" in 200*) ;; *) bad=1;; esac
          done
          exit $bad
