name: Deploy Genesis to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the site from the zip parts and verify the checksum
        run: |
          cd genesis/dist
          cat Genesis-v0.97-DEPLOY-www.zip.0* > /tmp/site.zip
          echo "$(cut -d' ' -f1 JOIN_CHECK.sha256)  /tmp/site.zip" | sha256sum -c -
          mkdir -p /tmp/_site && unzip -q /tmp/site.zip -d /tmp/_site
          touch /tmp/_site/.nojekyll
          test -f /tmp/_site/studio.html && test -f /tmp/_site/models/modnet.onnx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site
      - id: deployment
        uses: actions/deploy-pages@v4
