name: Deploy Genesis to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the site from source (scripts/build-site.sh) and verify it
        run: |
          cd genesis
          sh scripts/build-site.sh
          test -f www/studio.html && test -f www/models/modnet.onnx
          test -f www/vendor/ort/ort-wasm-simd-threaded.asyncify.wasm && test -f www/js/providers/hybrid-provider.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: genesis/www
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site from GitHub's servers
        run: |
          sleep 25
          B=https://hypernoesis.github.io/dawn
          bad=0
          for p in "" studio.html index.html sw.js manifest.json models/modnet.onnx models/ppmatting_v2.onnx js/app.js js/providers/hybrid-provider.js vendor/ort/ort-wasm-simd-threaded.asyncify.wasm; do
            code=$(curl -s -o /dev/null -L -w '%{http_code} %{size_download}B %{content_type}' "$B/$p")
            echo "::notice title=live check::/dawn/$p -> $code"
            case "$code" in 200*) ;; *) bad=1;; esac
          done
          exit $bad
