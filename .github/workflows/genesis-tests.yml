name: Genesis segmentation regression gates

on:
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-tests.yml"
  pull_request:
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segmentation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: genesis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore required model and runtime binaries
        run: sh scripts/restore-big-files.sh

      - name: Install Python test dependencies
        run: python -m pip install -q pillow numpy opencv-python-headless scipy scikit-image imageio-ffmpeg fastapi httpx uvicorn

      - name: Run provider and pure-logic unit suites
        run: |
          npm run test:unit
          fail=0
          for f in tools/e2e/unit_*.js; do
            node "$f" > /tmp/genesis-unit.log 2>&1 || {
              echo "::error::$f failed"
              tail -30 /tmp/genesis-unit.log
              fail=1
            }
          done
          exit "$fail"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run camera, model, motion, and matte-edge browser gates
        run: |
          node tools/e2e/t40_pipeline_gate.js
          node tools/e2e/t41_modnet_gate.js
          node tools/e2e/t43_rvm_gate.js
          node tools/e2e/t44_threads_gate.js
          node tools/e2e/t42_enhance.js
          node tools/e2e/t49_matte_edge_gate.js

      - name: Run export safety and API regression suites
        run: |
          python server/studio-export/test_pipeline_logic.py
          python server/studio-export/test_scene_logic.py
          python server/studio-export/test_export_safety.py
          python server/studio-export/test_export_e2e.py
          python gpu/test_export_api.py

      - name: Verify the deployable site builds
        run: sh scripts/build-site.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-segmentation-gate-report
          path: |
            genesis/gate_report.json
            genesis/gate_last_frame.png
