name: Genesis segmentation adaptive regression gates

on:
  push:
    branches: [main]
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-tests.yml"
  pull_request:
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-tests.yml"
  workflow_dispatch:

# Cancel superseded runs within each event type. Feature branches are validated
# by their pull_request event; only main gets a separate push-triggered run.
# This avoids push/PR concurrency groups cancelling each other on the same commit.
concurrency:
  group: genesis-segmentation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  segmentation-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: genesis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore required model and runtime binaries
        run: sh scripts/restore-big-files.sh

      - name: Fetch checksum-verified PP-MattingV2 and EdgeTAM browser models
        run: node scripts/fetch-models.js --only edgetam,edgetam-fp32,ppmatting-v2

      - name: Install Python test dependencies
        run: python -m pip install -q pillow numpy opencv-python-headless scipy scikit-image imageio-ffmpeg fastapi httpx uvicorn

      - name: Install and test protected signalling/render services
        run: |
          npm install --prefix server --no-audit --no-fund
          npm test --prefix server

      - name: Validate browser, worker, build and server JavaScript syntax
        run: |
          find js tools/e2e server scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run provider and pure-logic unit suites
        run: |
          npm run test:unit
          fail=0
          for f in tools/e2e/unit_*.js; do
            node "$f" > /tmp/genesis-unit.log 2>&1 || {
              echo "::error::$f failed"
              tail -30 /tmp/genesis-unit.log
              fail=1
            }
          done
          exit "$fail"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Run Studio tab navigation and responsive shell smoke gate
        run: node tools/e2e/t51_studio_shell_responsive.js

      - name: Run camera, model, motion, and matte-edge browser gates
        run: |
          node tools/e2e/t40_pipeline_gate.js
          node tools/e2e/t41_modnet_gate.js
          node tools/e2e/t43_rvm_gate.js
          node tools/e2e/t44_threads_gate.js
          node tools/e2e/t42_enhance.js
          node tools/e2e/t49_matte_edge_gate.js
          # Diagnostic-only profile comparison across clean, noisy, low-contrast,
          # dark, hair-strand and motion-lag synthetic edge cases. Keep production
          # defaults unchanged until these profiles and real footage agree.
          MATTE_PARAMS='{"edgeLo":0.15,"edgeHi":0.85}' node tools/e2e/t49_matte_edge_gate.js --report
          MATTE_PARAMS='{"edgeLo":0.05,"edgeHi":0.95}' node tools/e2e/t49_matte_edge_gate.js --report
          node tools/e2e/t50_ultramatte_gate.js

      - name: Run export safety and API regression suites
        run: |
          python server/studio-export/test_pipeline_logic.py
          python server/studio-export/test_scene_logic.py
          python server/studio-export/test_export_safety.py
          python server/studio-export/test_export_e2e.py
          python tools/matte-bench/test_metrics.py
          python gpu/test_export_api.py

      - name: Verify the deployable site builds
        run: sh scripts/build-site.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-segmentation-gate-report
          path: |
            genesis/gate_report.json
            genesis/gate_last_frame.png
            genesis/ultramatte_gate_report.json
            genesis/ultramatte_last_comparison.png
            genesis/ultramatte_last_composite.png
            genesis/studio-smoke-artifacts/**
