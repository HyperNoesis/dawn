<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genesis matting lab (PP-Matting beta)</title>
<style>
  :root { color-scheme: dark; --bg:#0e1013; --card:#171a20; --ink:#e8eaee; --dim:#98a0ad; --ok:#4cc38a; --bad:#ff6b6b; --warn:#f5c451; --line:#2a2f38; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,sans-serif; padding:16px; max-width:1100px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; } p.sub { color:var(--dim); margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  label { color:var(--dim); font-size:13px; }
  select, button, input[type=file] { background:#222732; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; }
  button.primary { background:#3b6df0; border-color:#3b6df0; } button:disabled { opacity:.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
  .grid figure { margin:0; } figcaption { color:var(--dim); font-size:12px; margin-top:4px; }
  canvas { width:100%; height:auto; background:repeating-conic-gradient(#2b2f38 0 25%, #1d2027 0 50%) 0 0/16px 16px; border-radius:8px; display:block; }
  table { width:100%; border-collapse:collapse; font-size:13px; } td, th { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  .pass { color:var(--ok); } .fail { color:var(--bad); } .pending { color:var(--warn); }
  pre { background:#0b0d10; border:1px solid var(--line); border-radius:8px; padding:8px; overflow:auto; max-height:240px; font-size:12px; }
  .note { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<h1>Genesis matting lab <small class="note">PP-MattingV2 beta · PP-Matting HRNet export</small></h1>
<p class="sub">Everything runs on this device. No frames are uploaded. Use it to compare engines on the same input and to produce a report for the release gate.</p>

<div class="card">
  <div class="row">
    <label>Engine <select id="engine"><option value="modnet">MODNet (shipped baseline: run this first)</option><option value="ppmatting-v2" selected>PP-MattingV2 (live beta)</option><option value="ppmatting-hrnet">PP-Matting HRNet (export quality)</option></select></label>
    <label>Quality <select id="quality"><option value="fast">fast (320)</option><option value="balanced" selected>balanced (384)</option><option value="quality">quality (512)</option></select></label>
    <label>Backend <select id="backend"><option value="auto">auto</option><option value="wasm">WASM only</option></select></label>
  </div>
  <div class="row" style="margin-top:8px">
    <input type="file" id="file" accept="image/*,video/*">
    <button id="runStill" class="primary" disabled>Matte this image</button>
    <button id="startCam" disabled>Live camera</button>
    <button id="startVid" disabled>Live on video file</button>
    <button id="stop" disabled>Stop</button>
  </div>
  <p class="note" id="status">Loading…</p>
</div>

<div class="card">
  <div class="grid">
    <figure><canvas id="cSrc"></canvas><figcaption>Source</figcaption></figure>
    <figure><canvas id="cRaw"></canvas><figcaption>Raw matte (model output)</figcaption></figure>
    <figure><canvas id="cRef"></canvas><figcaption>Refined matte (temporal)</figcaption></figure>
    <figure><canvas id="cCut"></canvas><figcaption>Cutout (raw) · <button id="dl" disabled>Download PNG</button></figcaption></figure>
  </div>
</div>

<div class="card">
  <table id="metrics"></table>
  <div class="row" style="margin-top:8px">
    <label>Ground-truth alpha (optional) <input type="file" id="gtFile" accept="image/*"></label>
  </div>
</div>

<div class="card">
  <div class="row"><button id="mkReport">Build gate report</button><label><input type="checkbox" id="mHair"> hair and fingers at least as good as baseline (my eyes, real footage)</label><label><input type="checkbox" id="mDev"> tested on a real phone/device</label><label><input type="checkbox" id="mLic"> licence reviewed</label></div>
  <table id="gate" style="margin-top:8px"></table>
  <pre id="report">{}</pre>
</div>

<script src="js/loader.js"></script>
<script src="js/providers/model-store.js"></script>
<script src="js/providers/ppmatting-core.js"></script>
<script src="js/providers/temporal-matte.js"></script>
<script src="js/providers/matting-metrics.js"></script>
<script src="js/providers/engine-policy.js"></script>
<script src="js/providers/roi-track.js"></script>
<script src="js/providers/modnet-provider.js"></script>
<script src="js/providers/ppmatting-provider.js"></script>
<script src="js/providers/ppmatting-export.js"></script>
<script src="js/ppmatting-lab.js"></script>
</body>
</html>
